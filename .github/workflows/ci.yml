name: Eagle LSP CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every supported OS on the active LTS, plus the oldest supported
        # and the current Node release on Linux.  Windows matters here:
        # the brace scanner has CRLF-specific behavior.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all JavaScript sources
        shell: bash
        run: |
          for f in server.js eagle-parser.js eagle-data.js eagle-brace.js \
                   editors/vscode/extension.js; do
            node --check "$f"
            echo "OK $f"
          done

      - name: Validate data files parse as JSON
        shell: bash
        run: |
          node -e "
            for (const f of ['data/eagle_commands.json',
                             'data/eagle_procedures.json']) {
              JSON.parse(require('fs').readFileSync(f, 'utf8'));
              console.log('OK ' + f);
            }
          "

      - name: Run unit tests
        run: npm test

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the VS Code extension (esbuild bundle + vsce)
        run: bash scripts/package-vsix.sh

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: eagle-lsp-vsix
          path: '*.vsix'
          if-no-files-found: error
